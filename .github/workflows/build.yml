name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/LanguageAutocorrect.Engine.Tests
      - name: Publish
        run: dotnet publish src/LanguageAutocorrect -c Release -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: LanguageAutocorrect
          path: publish/LanguageAutocorrect.exe

  # The download page (website/) on GitHub Pages, with the app just built as its download.
  website:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LanguageAutocorrect
          path: download
      # The site's Download button links to this release, so GitHub counts the downloads (the site's /downloads/ page
      # shows them). One release per version: a push that keeps the version keeps its release and its count.
      # Updates still come from the copy on the site, so they aren't counted.
      - name: Release this version on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/LanguageAutocorrect/LanguageAutocorrect.csproj)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Version $version is already released."
          else
            gh release create "v$version" download/LanguageAutocorrect.exe --target "$GITHUB_SHA" \
              --title "Language Autocorrect $version" \
              --notes "What's new: https://language-autocorrect.world/release-notes/#v$version"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the website
        working-directory: website
        run: |
          npm ci
          DOWNLOAD_BYTES=$(stat -c %s ../download/LanguageAutocorrect.exe) npm run build
          cp ../download/LanguageAutocorrect.exe dist/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
      - id: deploy
        uses: actions/deploy-pages@v5
