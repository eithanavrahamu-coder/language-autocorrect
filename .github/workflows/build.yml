name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/LayoutBuddy.Engine.Tests
      - name: Publish
        run: dotnet publish src/LayoutBuddy -c Release -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: LayoutBuddy
          path: publish/LayoutBuddy.exe
