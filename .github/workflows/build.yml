name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/LanguageAutocorrect.Engine.Tests
      - name: Publish
        run: dotnet publish src/LanguageAutocorrect -c Release -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: LanguageAutocorrect
          path: publish/LanguageAutocorrect.exe

  # The download page (website/) on GitHub Pages, with the app just built as its download.
  website:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LanguageAutocorrect
          path: download
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the website
        working-directory: website
        run: |
          npm ci
          DOWNLOAD_BYTES=$(stat -c %s ../download/LanguageAutocorrect.exe) npm run build
          cp ../download/LanguageAutocorrect.exe dist/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
      - id: deploy
        uses: actions/deploy-pages@v5
