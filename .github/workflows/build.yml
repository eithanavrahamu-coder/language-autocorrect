name: Build

on:
  push:
    # Branches under try/ build and test both apps without releasing anything (the website job is main only).
    branches: [main, 'try/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/LanguageAutocorrect.Engine.Tests
      - name: Publish
        run: dotnet publish src/LanguageAutocorrect -c Release -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: LanguageAutocorrect
          path: publish/LanguageAutocorrect.exe

  # The Mac app (beta), built on a Mac: one app for Apple silicon and Intel, in a disk image to drag to Applications.
  # It isn't signed by Apple (that needs a paid Apple developer account), only "ad hoc", which Apple silicon requires.
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install the .NET macOS workload
        run: dotnet workload install macos
      - name: Build
        run: dotnet build src/LanguageAutocorrect.Mac -c Release -p:ValidateXcodeVersion=false
      - name: Sign
        run: |
          app=$(find src/LanguageAutocorrect.Mac/bin/Release -maxdepth 3 -name '*.app' -type d | head -1)
          mkdir dmg
          cp -R "$app" "dmg/Language Autocorrect.app"
          codesign --force --deep --sign - "dmg/Language Autocorrect.app"
          codesign --verify --deep --strict "dmg/Language Autocorrect.app"
          lipo -archs "dmg/Language Autocorrect.app/Contents/MacOS/LanguageAutocorrect"
      # Starts the app and checks keyboards, detection, the menu bar icon and the window (MacApp.RunSelfCheck).
      - name: Self-check
        timeout-minutes: 3
        run: '"dmg/Language Autocorrect.app/Contents/MacOS/LanguageAutocorrect" --selfcheck'
      - name: Disk image
        run: |
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Language Autocorrect" -srcfolder dmg -ov -format UDZO LanguageAutocorrect.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LanguageAutocorrect-mac
          path: LanguageAutocorrect.dmg

  # The download page (website/) on GitHub Pages, with the apps just built as its downloads.
  website:
    needs: [build, mac]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LanguageAutocorrect
          path: download
      - uses: actions/download-artifact@v4
        with:
          name: LanguageAutocorrect-mac
          path: download
      # The site's Download buttons link to this release, so GitHub counts the downloads (the site's /downloads/ page
      # shows them). One release per version: a push that keeps the version keeps its release and its counts (a file
      # the release doesn't have yet is added). Updates of the Windows app still come from the copy on the site, so
      # they aren't counted.
      - name: Release this version on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/LanguageAutocorrect/LanguageAutocorrect.csproj)
          files="download/LanguageAutocorrect.exe download/LanguageAutocorrect.dmg"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Version $version is already released."
            for f in $files; do
              if ! gh release view "v$version" --json assets --jq '.assets[].name' | grep -qx "$(basename "$f")"; then
                gh release upload "v$version" "$f"
              fi
            done
          else
            gh release create "v$version" $files --target "$GITHUB_SHA" \
              --title "Language Autocorrect $version" \
              --notes "What's new: https://language-autocorrect.world/release-notes/#v$version"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the website
        working-directory: website
        run: |
          npm ci
          DOWNLOAD_BYTES=$(stat -c %s ../download/LanguageAutocorrect.exe) \
          MAC_DOWNLOAD_BYTES=$(stat -c %s ../download/LanguageAutocorrect.dmg) npm run build
          cp ../download/LanguageAutocorrect.exe dist/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
      - id: deploy
        uses: actions/deploy-pages@v5
